# ==============================================================================
# Nginx Configuration for Marketplace (Production SSL / HTTPS)
# ==============================================================================

# 1. HTTP Server — Handles ACME Challenge for Let's Encrypt & Redirects to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com; # <-- استبدل هذا باسم الدومين الخاص بك

    # مسار التحقق من شهادة Let's Encrypt التلقائي (Certbot HTTP-01 Challenge)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # تحويل كافة الطلبات تلقائياً إلى HTTPS المشفر
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server — Secure SSL / TLS Termination
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com; # <-- استبدل هذا باسم الدومين الخاص بك

    # مسارات شهادة SSL (يتم توليدها تلقائياً بواسطة Certbot)
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # بروتوكولات وتشفيرات الأمان الحديثة (Mozilla Intermediate Guidelines)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # تحسين أداء اتصالات SSL المتكررة (Session Caching)
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # ترويسة HSTS لإجبار المتصفحات على HTTPS دائماً
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # حجم الملفات المسموح برفعها (الصور)
    client_max_body_size 10M;

    # تمرير الطلبات إلى تطبيق Node.js / Hono
    location / {
        # عنوان المنفذ الذي يعمل عليه تطبيق Node (3000 افتراضياً)
        proxy_pass http://127.0.0.1:3000;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # الترويسات الضرورية ليعرف التطبيق أنه خلف اتصال SSL مشفر
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # المهلات (Timeouts)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # مسار التحقق من التجديد التلقائي لـ Certbot على HTTPS أيضاً
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
