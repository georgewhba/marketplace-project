name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketplace_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: cd client && npm ci
      - name: Typecheck / Lint
        run: npm run lint
      - name: Migrate test DB
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marketplace_test
          JWT_ACCESS_SECRET: test_secret_minimum_32_characters_long
          JWT_REFRESH_SECRET: test_secret_minimum_32_characters_long_2
      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marketplace_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marketplace_test
          JWT_ACCESS_SECRET: test_secret_minimum_32_characters_long
          JWT_REFRESH_SECRET: test_secret_minimum_32_characters_long_2
      - name: Build
        run: npm run build
      - name: Security audit
        run: npm audit --audit-level=high

  e2e:
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketplace_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: cd client && npm ci
      - name: Install Playwright Browsers
        run: cd client && npx playwright install --with-deps chromium
      - name: Migrate test DB
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marketplace_test
          JWT_ACCESS_SECRET: test_secret_minimum_32_characters_long
          JWT_REFRESH_SECRET: test_secret_minimum_32_characters_long_2
      - name: Run E2E tests
        run: |
          PORT=3001 npm run dev &
          npm run test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marketplace_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marketplace_test
          JWT_ACCESS_SECRET: test_secret_minimum_32_characters_long
          JWT_REFRESH_SECRET: test_secret_minimum_32_characters_long_2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: client/test-results/
          retention-days: 7
