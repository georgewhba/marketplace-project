name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/marketplace_test
      JWT_ACCESS_SECRET: test-secret-access-12345678901234567890
      JWT_REFRESH_SECRET: test-secret-refresh-12345678901234567890
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d
      PORT: 3000
      NODE_ENV: test
      CORS_ORIGIN: http://localhost:5173
      UPLOAD_DIR: ./uploads
      MAX_FILE_SIZE_MB: 5
      SEED_ADMIN_EMAIL: admin@marketplace.com
      SEED_ADMIN_PASSWORD: Admin@123456

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          cd client && npm ci

      - name: Typecheck
        run: |
          npm run lint
          cd client && npm run build

      - name: Run Database Migrations
        run: npm run db:migrate

      - name: Run Tests (Unit & Integration)
        run: npm test

      - name: Build Application
        run: npm run build

      - name: NPM Audit
        run: npm audit --audit-level=high

  e2e:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/marketplace_test
      JWT_ACCESS_SECRET: test-secret-access-12345678901234567890
      JWT_REFRESH_SECRET: test-secret-refresh-12345678901234567890
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d
      PORT: 3000
      NODE_ENV: test
      CORS_ORIGIN: http://localhost:5173
      UPLOAD_DIR: ./uploads
      MAX_FILE_SIZE_MB: 5
      SEED_ADMIN_EMAIL: admin@marketplace.com
      SEED_ADMIN_PASSWORD: Admin@123456
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          cd client && npm ci

      - name: Install Playwright Browsers
        run: cd client && npx playwright install --with-deps

      - name: Run Database Migrations & Seed
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Run E2E Tests
        run: npm run test:e2e
