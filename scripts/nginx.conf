# /etc/nginx/sites-available/marketplace.conf

server {
    listen 80;
    server_name marketplace.example.com; # Replace with your domain

    # Redirect all HTTP traffic to HTTPS
    # return 301 https://$host$request_uri;
    
    # Enable this block when SSL is configured (e.g., via Let's Encrypt / Certbot)
    # listen 443 ssl;
    # ssl_certificate /etc/letsencrypt/live/marketplace.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/marketplace.example.com/privkey.pem;

    # Security Headers (also enforced in Hono Node app, but good to have at proxy level)
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Serve static uploads directly through Nginx (faster than Node.js)
    location /uploads/ {
        alias /path/to/your/project/uploads/; # UPDATE THIS PATH
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # API Proxy to Hono Node.js Server
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Pass real client IP to Node.js (vital for rate limiting)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve built client static files
    location / {
        root /path/to/your/project/client/dist; # UPDATE THIS PATH
        try_files $uri $uri/ /index.html;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires max;
            log_not_found off;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
